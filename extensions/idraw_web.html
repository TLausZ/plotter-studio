<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>iDraw Interactive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&family=Barlow:wght@400;500&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
/* Material Design 3 components (m3.material.io) on the drafting palette: light neutral
   panel, ink black as primary, white controls, red for pen down and Stop, blue for pen up,
   amber for paused and the origin. Single light scheme by choice. */
:root{
  --md-primary:#1B1B1B; --md-on-primary:#FFFFFF; --md-primary-container:#E2E4DD; --md-on-primary-container:#1B1B1B;
  --md-secondary:#5C5F58; --md-on-secondary:#FFFFFF; --md-secondary-container:#E2E4DD; --md-on-secondary-container:#1B1B1B;
  --md-tertiary:#1F5FBF; --md-on-tertiary:#FFFFFF; --md-tertiary-container:#DCE7F7; --md-on-tertiary-container:#0B3A78;
  --md-error:#C8102E; --md-on-error:#FFFFFF; --md-error-container:#F7D6DA; --md-on-error-container:#6B0010;
  --md-surface:#ECEDE8; --md-on-surface:#1B1B1B; --md-surface-variant:#E2E4DD; --md-on-surface-variant:#5C5F58;
  --md-outline:#C9CCC3; --md-outline-variant:#D8DBD3;
  --md-surface-container-lowest:#FFFFFF; --md-surface-container-low:#ECEDE8; --md-surface-container:#E2E4DD;
  --md-surface-container-high:#FFFFFF; --md-surface-container-highest:#D6D9D0;
  --md-inverse-surface:#1B1B1B; --md-inverse-on-surface:#ECEDE8;
  --md-amber:#C98A00;
  --mat:#2E5C4C; --mat-line:rgba(255,255,255,.09); --mat-line-strong:rgba(255,255,255,.16);
  --paper:#FFFFFF; --ink:#1B1B1B; --ink-muted:#5C5F58; --ink-faint:#B8BDB5; --pen-down:#C8102E; --pen-up:#1F5FBF; --origin:#C98A00;
  --f:"Roboto",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  --f-mono:"Roboto Mono",Menlo,Consolas,monospace;
  --f-draft:"Barlow",system-ui,sans-serif; --f-draft-mono:"IBM Plex Mono",Menlo,monospace;
  --side:380px;
  --e1:0 1px 2px rgba(0,0,0,.2),0 1px 3px 1px rgba(0,0,0,.1);
  --e3:0 1px 3px rgba(0,0,0,.3),0 4px 8px 3px rgba(0,0,0,.15);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:400 14px/20px var(--f);letter-spacing:.25px;color:var(--md-on-surface);background:var(--md-surface);
  display:flex;flex-direction:column;height:100vh;overflow:hidden}
button,input,select{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* type scale */
.title-large{font:400 22px/28px var(--f);letter-spacing:0}
.title-medium{font:500 16px/24px var(--f);letter-spacing:.15px}
.label-large{font:500 14px/20px var(--f);letter-spacing:.1px}
.label-medium{font:500 12px/16px var(--f);letter-spacing:.5px}
.body-medium{font:400 14px/20px var(--f);letter-spacing:.25px}
.body-small{font:400 12px/16px var(--f);letter-spacing:.4px}

/* buttons: common (M3 40px, full shape, state layer via ::before) */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:40px;padding:0 20px;border-radius:20px;border:0;background:transparent;cursor:pointer;
  font:500 14px/20px var(--f);letter-spacing:.1px;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.btn::before{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .12s}
.btn:hover::before{opacity:.08} .btn:focus-visible::before{opacity:.10} .btn:active::before{opacity:.12}
.btn:focus-visible{outline:2px solid var(--md-primary);outline-offset:2px}
.btn:disabled{cursor:default;opacity:.38}
.filled{background:var(--md-primary);color:var(--md-on-primary);box-shadow:none}
.filled:hover{box-shadow:var(--e1)}
.tonal{background:var(--md-surface-container-lowest);color:var(--md-on-surface);border:1px solid var(--md-outline)}
.outlined{color:var(--md-primary);border:1px solid var(--md-outline)}
.text{color:var(--md-primary);padding:0 12px}
.danger{background:var(--md-error);color:var(--md-on-error)}
.icon-btn{width:40px;height:40px;padding:0;border-radius:20px;font-size:19px}
.icon-btn.tonal{background:var(--md-surface-container-lowest);color:var(--md-on-surface);border:1px solid var(--md-outline)}

/* segmented buttons */
.seg{display:inline-flex}
.seg .btn{border:1px solid var(--md-outline);border-radius:0;padding:0 16px;color:var(--md-on-surface);margin-left:-1px}
.seg .btn:first-child{border-radius:20px 0 0 20px;margin-left:0} .seg .btn:last-child{border-radius:0 20px 20px 0}
.seg .btn.on{background:var(--md-primary);color:var(--md-on-primary);border-color:var(--md-primary)}
.seg .btn.on::after{content:"✓";font-size:13px;margin-right:2px;order:-1}
.seg.small .btn{height:32px;padding:0 12px;font-size:13px}

/* text fields (outlined); the label sits in normal flow, not absolute, so multi-column layout cannot misplace it */
.tf{display:flex;flex-direction:column;min-width:0}
.tf label{position:relative;z-index:1;align-self:flex-start;margin:0 0 -8px 12px;padding:0 4px;background:var(--md-surface-container-low);
  font:400 12px/16px var(--f);letter-spacing:.4px;color:var(--md-on-surface-variant);pointer-events:none;white-space:nowrap}
.tf input,.tf select{height:44px;padding:12px 14px 0;border:1px solid var(--md-outline);border-radius:4px;background:var(--md-surface-container-lowest);
  color:var(--md-on-surface);width:100%;outline:0;appearance:none;-webkit-appearance:none}
.tf input.mono{font-family:var(--f-mono)}
.tf:focus-within input,.tf:focus-within select{border:2px solid var(--md-primary);padding-left:15px}
.tf:focus-within label{color:var(--md-primary)}
.tf select{padding-top:12px;background-image:linear-gradient(45deg,transparent 50%,var(--md-on-surface-variant) 50%),linear-gradient(135deg,var(--md-on-surface-variant) 50%,transparent 50%);
  background-position:calc(100% - 20px) 20px,calc(100% - 15px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.tf.w{width:150px} .tf.grow{flex:1}

/* checkbox, radio */
input[type=checkbox],input[type=radio]{accent-color:var(--md-primary);width:18px;height:18px;margin:0}
.radio{display:flex;align-items:center;gap:12px;min-height:32px;cursor:pointer;padding:0 4px;border-radius:8px}
.radio:hover{background:var(--md-surface-container)}

/* top app bar */
header{display:flex;align-items:center;gap:16px;padding:0 16px 0 24px;background:var(--md-surface);border-bottom:1px solid var(--md-outline-variant)}
.brand{font:400 22px/28px var(--f)} .brand span{color:var(--md-on-surface-variant)}
.readout{display:flex;gap:16px;align-items:center;margin-left:auto}
.chip{height:32px;display:inline-flex;align-items:center;padding:0 12px;border-radius:8px;border:1px solid var(--md-outline);
  font:500 14px/20px var(--f);letter-spacing:.1px;text-transform:capitalize;color:var(--md-on-surface)}
.chip.ready{border-color:var(--md-primary)}
.chip.moving,.chip.plotting{background:var(--md-primary);color:var(--md-on-primary);border-color:transparent}
.chip.paused{background:var(--md-amber);color:#fff;border-color:transparent}
.chip.error{background:var(--md-error-container);color:var(--md-on-error-container);border-color:transparent}
.pen{font:500 14px/20px var(--f)} .pen.down{color:var(--md-error)} .pen.up{color:var(--md-tertiary)}

/* layout: app bar, then board (left) beside the side column (right): step tabs, step panel, Back/Next/Stop */
header{flex:0 0 56px}
.tabs{display:flex;margin:0;padding:0 4px;flex:0 0 44px;border-bottom:1px solid var(--md-outline-variant)}
.tabs li{list-style:none;position:relative;flex:1;min-width:0;padding:0 4px;display:flex;align-items:center;justify-content:center;gap:6px;
  cursor:pointer;color:var(--md-on-surface-variant);font:500 14px/20px var(--f);letter-spacing:.1px;user-select:none}
.tabs li:hover{background:var(--md-surface-container)}
.tabs li b{font:500 15px/20px var(--f-mono)}
.tabs li.active{color:var(--md-primary)}
.tabs li.active::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--md-primary)}
.tabs li.done b::after{content:" ✓";font-size:11px}
.nav{flex:0 0 auto;display:flex;gap:8px;padding:6px 16px;align-items:center;border-top:1px solid var(--md-outline-variant)}
.nav #stop{margin-left:auto}
.side{display:flex;flex-direction:column;min-height:0;background:var(--md-surface-container-low);border-left:1px solid var(--md-outline-variant)}
#fitseg{position:absolute;top:8px;right:8px;z-index:1}
#zoom{position:absolute;top:56px;left:19px;z-index:1;writing-mode:vertical-lr;direction:rtl;height:140px;width:18px;accent-color:var(--md-surface-container-lowest);cursor:pointer}
#zoomlbl{position:absolute;top:202px;left:8px;z-index:1;width:40px;text-align:center;font:500 12px/18px var(--f-mono);color:#fff;background:rgba(0,0,0,.45);border-radius:9px;pointer-events:none}
.board svg.pan{cursor:grab} .board svg.pan:active{cursor:grabbing}
#tbpos{position:absolute;top:8px;left:8px;z-index:1;font-size:20px;background:var(--md-surface-container-lowest);border-color:var(--md-outline)}
.split{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(440px,520px)}
.boardwrap{display:flex;flex-direction:column;min-height:0;min-width:0}
.board{flex:0 0 70%;min-height:0}
.panel{flex:1 1 auto;min-height:0;overflow:auto;padding:6px 20px 8px}
.grp{margin-bottom:2px}
.panel h1{font:400 20px/28px var(--f);letter-spacing:0;margin:0 0 2px}
.hdr p{margin:0 0 4px}
.panel h2{font:500 12px/16px var(--f);letter-spacing:.5px;text-transform:uppercase;color:var(--md-on-surface-variant);margin:6px 0 6px}
.panel p{margin:0 0 10px;color:var(--md-on-surface-variant)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.card{background:var(--md-surface-container-lowest);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:var(--e1)}
.jog{display:grid;grid-template-columns:40px 40px 40px auto auto;grid-template-rows:40px 40px 40px;gap:4px;align-items:center;margin:2px 0 2px}
.jog .extra{grid-row:1/4;grid-column:5;display:flex;flex-direction:column;gap:8px;align-items:flex-start;justify-content:center;padding-left:16px}
.jog .sizes{grid-row:1/4;grid-column:4;padding-left:16px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.jog .sizes .seg{flex-direction:column}
.jog .sizes .seg .btn{border-radius:0;margin:-1px 0 0;height:34px;padding:0 14px;font-family:var(--f-mono);width:100px;justify-content:flex-start}
.jog .sizes .seg .btn:first-child{border-radius:18px 18px 0 0;margin:0} .jog .sizes .seg .btn:last-child{border-radius:0 0 18px 18px}
.hint{font:400 12px/18px var(--f);letter-spacing:.4px;color:var(--md-on-surface-variant);margin:2px 0 8px}
.hint kbd{font-family:var(--f-mono);border:1px solid var(--md-outline-variant);border-radius:4px;padding:0 5px;background:var(--md-surface)}
.layers{width:100%;border-collapse:collapse;margin-bottom:16px}
.layers td,.layers th{padding:7px 8px;border-bottom:1px solid var(--md-outline-variant);text-align:left}
.layers th{font:500 12px/16px var(--f);letter-spacing:.5px;color:var(--md-on-surface-variant)}
.layers td{font:400 14px/20px var(--f)}
.progress{height:4px;border-radius:2px;background:var(--md-surface-container-highest);margin:16px 0 8px;position:relative;overflow:hidden}
.progress i{position:absolute;left:0;top:0;bottom:0;background:var(--md-primary);border-radius:2px;width:0;transition:width .2s}
.msg{padding:12px 16px;border-radius:12px;background:#FFFFFF;border-left:4px solid var(--md-amber);margin-bottom:16px}

/* board: the drafting sheet stays as it is */
.board{position:relative;background:var(--mat);overflow:hidden}
.board svg{width:100%;height:100%;display:block}
.stroke{fill:none;stroke:var(--ink-faint);stroke-linecap:round;stroke-linejoin:round}
.stroke.done{stroke:var(--ink)}
.penmark.up{stroke:var(--pen-up)} .penmark.down{stroke:var(--pen-down)}
.ruler text{font-family:var(--f-draft-mono);fill:rgba(255,255,255,.75)}
.ruler line{stroke:rgba(255,255,255,.55)}
.tb text{font-family:var(--f-draft);fill:var(--ink)} .tb .k{fill:var(--ink-muted)}
.tb .v{font-family:var(--f-draft-mono)} .tb rect,.tb line{stroke:var(--ink);fill:none}

/* log */
.log{flex:1 1 auto;min-height:44px;margin:0;padding:4px 16px;overflow:auto;font:400 12px/18px var(--f-mono);color:var(--md-on-surface-variant);white-space:pre-wrap;
  background:var(--md-surface-container-lowest);border-top:1px solid var(--md-outline-variant)}

/* dialog */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);display:none;align-items:center;justify-content:center;z-index:10}
.scrim.show{display:flex}
.dialog{border-top:4px solid var(--md-amber);background:var(--md-surface-container-high);color:var(--md-on-surface);padding:24px;min-width:280px;max-width:560px;border-radius:28px;box-shadow:var(--e3)}
.dialog h3{font:400 24px/32px var(--f);margin:0 0 16px}
.dialog p{color:var(--md-on-surface-variant);margin:0 0 24px}
.dialog .actions{display:flex;justify-content:flex-end;gap:8px}

@media (max-width: 900px){
  body{overflow:auto;height:auto}
  .split{display:flex;flex-direction:column}
  .board{flex:0 0 60vw}
  .side{border-left:0} .panel{overflow:visible}
  header{padding:0 16px} .brand span{display:none}
  .btn{height:44px}
  .tabs li{min-width:0;padding:0 8px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>
<body>
<header>
  <div class="brand">iDraw <span>Interactive</span></div>
  <div class="readout">
    <span id="status" class="chip">disconnected</span>
    <span id="pos" class="mono">X — Y —</span>
    <span id="penlbl" class="pen">pen ?</span>
  </div>
  <div class="seg small" id="units">
    <button class="btn" data-unit="mm">mm</button><button class="btn" data-unit="cm">cm</button><button class="btn" data-unit="in">in</button>
  </div>
</header>
<main class="split">
  <section class="boardwrap">
    <div class="board">
      <button class="btn icon-btn outlined" id="tbpos" title="Title block corner">◲</button>
      <input type="range" id="zoom" min="0" max="8" value="2" title="Zoom; drag the board to pan, double-click to reset"><span id="zoomlbl">1×</span>
      <div class="seg small" id="fitseg"><button class="btn on" data-fit="sheet">Sheet</button><button class="btn" data-fit="machine">Machine</button></div>
      <svg id="preview" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <pre class="log" id="log"></pre>
  </section>
  <section class="side">
    <ol class="tabs" id="steps"></ol>
    <div class="panel" id="panel"></div>
    <div class="nav">
      <button class="btn outlined" id="back">Back</button><button class="btn tonal" id="next">Next</button>
      <button class="btn danger" id="stop">Stop</button>
    </div>
  </section>
</main>
<div class="scrim" id="overlay">
  <div class="dialog" role="dialog" aria-modal="true">
    <h3>Pause before layer <span id="pauseName"></span></h3>
    <p>Change the pen, then continue. Stop ends the plot; the pen stays up.</p>
    <div class="actions"><button class="btn text" id="pauseStop">Stop</button><button class="btn filled" id="pauseGo">Continue</button></div>
  </div>
</div>

<script>
'use strict';
const STEPS = ['Connect','Paper','Pen','Speed','Plot'];
const UNIT = {mm:1, cm:10, in:25.4};
const DEC = {mm:1, cm:2, in:2};
const JOG = {mm:[1,10,50], cm:[0.1,1,5], in:[0.05,0.5,2]};
const MODELS = {"iDraw A1":[864,594],"iDraw A0":[1189,841],"iDraw A2":[594,432],"iDraw A3":[430,297],"iDraw A4":[300,210]};
let S = null;            // snapshot from the server
let step = 0;
let jogIdx = 1;
let done = 0;            // strokes plotted so far
const $ = id => document.getElementById(id);

// ---------------------------------------------------------------- units
const u = () => S ? S.unit : 'mm';
const toU = mm => (mm / UNIT[u()]).toFixed(DEC[u()]);
const fromU = v => parseFloat(v) * UNIT[u()];
const fmt = mm => toU(mm) + ' ' + u();

// ---------------------------------------------------------------- server
async function cmd(name, args) {
  const r = await fetch('/api/cmd', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(Object.assign({cmd:name}, args || {}))});
  const j = await r.json();
  if (j.error) logLine('! ' + j.error);
  return j;
}
function connectEvents() {
  const es = new EventSource('/api/events');
  es.addEventListener('snapshot', e => { S = JSON.parse(e.data); done = S.progress ? S.progress.i : 0; renderAll(); });
  es.addEventListener('state', e => { if (!S) return; S.state = JSON.parse(e.data); renderReadout(); renderPen(); if (step === 2) syncPenFields(); });
  es.addEventListener('log', e => logLine(JSON.parse(e.data)));
  es.addEventListener('progress', e => { const p = JSON.parse(e.data); done = p.i; S.progress = p; renderProgress(); markDone(); });
  es.addEventListener('pause', e => { $('pauseName').textContent = JSON.parse(e.data); $('overlay').classList.add('show'); });
  es.addEventListener('done', e => { $('overlay').classList.remove('show'); logLine('Plot ' + JSON.parse(e.data) + '.'); });
  es.addEventListener('error', e => { if (e.data) logLine('! ' + JSON.parse(e.data)); });
  es.onerror = () => { $('status').textContent = 'no server'; $('status').className = 'chip error'; };
}
function logLine(t) {
  const el = $('log'); el.textContent += t + '\n';
  const lines = el.textContent.split('\n'); if (lines.length > 300) el.textContent = lines.slice(-300).join('\n');
  el.scrollTop = el.scrollHeight;
}

// ---------------------------------------------------------------- render
function renderAll() {
  $('log').textContent = S.log.join('\n') + '\n'; $('log').scrollTop = 1e9;
  document.querySelectorAll('#units button').forEach(b => b.classList.toggle('on', b.dataset.unit === S.unit));
  renderSteps(); renderPanel(); renderReadout(); renderPreview();
  if (S.pause_layer) { $('pauseName').textContent = S.pause_layer; $('overlay').classList.add('show'); }
}
function renderSteps() {
  const st = S.state;
  const doneFlags = [st.connected && st.homed, st.origin_set, false, false, false];
  $('steps').innerHTML = STEPS.map((n, i) =>
    `<li class="${i === step ? 'active' : ''} ${doneFlags[i] ? 'done' : ''}" data-i="${i}"><b>${i + 1}</b>${n}</li>`).join('');
  $('steps').querySelectorAll('li').forEach(li => li.onclick = () => showStep(+li.dataset.i));
}
function renderReadout() {
  const st = S.state;
  const s = $('status'); s.textContent = st.status; s.className = 'chip ' + st.status;
  $('pos').textContent = 'X ' + toU(st.x) + '  Y ' + toU(st.y) + ' ' + u();
  const pen = $('penlbl');
  pen.textContent = st.z_up === null ? 'pen ?' : (st.z_up ? 'pen up' : 'pen down');
  pen.className = 'pen ' + (st.z_up === null ? '' : (st.z_up ? 'up' : 'down'));
}
function showStep(i) { step = Math.max(0, Math.min(4, i)); renderSteps(); renderPanel(); }

// ---------------------------------------------------------------- panel
const tf = (id, label, value, opts = {}) =>
  `<div class="tf ${opts.cls || 'w'}"><label for="${id}">${label}${opts.suffix ? ' (' + opts.suffix + ')' : ''}</label><input id="${id}" class="${opts.mono === false ? '' : 'mono'}" value="${value}" ${opts.attrs || ''}></div>`;
const sel = (id, label, options, current, cls = 'grow', attrs = '') =>
  `<div class="tf ${cls}"><label for="${id}">${label}</label><select id="${id}" ${attrs}>${options.map(o => `<option ${o === current ? 'selected' : ''}>${o}</option>`).join('')}</select></div>`;
function jogHtml(extra = '') {
  const sizes = JOG[u()].map((v, i) => `<button class="btn ${i === jogIdx ? 'on' : ''}" data-jog="${i}">${v} ${u()}</button>`).join('');
  return `<div class="jog">
    <span></span><button class="btn icon-btn tonal" data-move="0,-1" aria-label="Move up">↑</button><span></span>
    <button class="btn icon-btn tonal" data-move="-1,0" aria-label="Move left">←</button><button class="btn icon-btn outlined" data-cmd="goto" data-args='{"x":0,"y":0}' title="Go to origin">⌂</button><button class="btn icon-btn tonal" data-move="1,0" aria-label="Move right">→</button>
    <span></span><button class="btn icon-btn tonal" data-move="0,1" aria-label="Move down">↓</button><span></span>
    <div class="sizes"><span class="label-medium" style="color:var(--md-on-surface-variant)">Step</span><div class="seg">${sizes}</div></div>${extra}</div>
    <div class="hint"><kbd>←↑↓→</kbd> move · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> step · <kbd>space</kbd> pen · <kbd>⇧↑</kbd><kbd>⇧↓</kbd> height · <kbd>esc</kbd> stop</div>`;
}
// Each step is a header plus groups; groups sit side by side and wrap, so everything stays above the fold.
const grp = (title, body, cls = '') => `<div class="grp ${cls}">${title ? `<h2>${title}</h2>` : ''}${body}</div>`;
const hdr = (title, text) => `<div class="hdr"><h1>${title}</h1>${text ? `<p>${text}</p>` : ''}</div>`;
function renderPanel() {
  const st = S.state, pr = st.profile;
  let h = '';
  if (step === 0) {
    const cur = S.sim && !st.connected ? 'Simulation' : (st.transport || (S.ports[1] || 'Simulation'));
    h = hdr('Connect', `Drawing: <b>${S.svg_name}</b>${S.svg_error ? ' <span style="color:var(--md-error)">(' + S.svg_error + ')</span>' : ''}`)
      + grp('Machine', `<div class="row">${sel('port', 'Port', S.ports, cur, 'grow', st.connected ? 'disabled' : '')}
        <button class="btn ${st.connected ? 'outlined' : 'filled'}" data-cmd="${st.connected ? 'disconnect' : 'connect'}" id="connBtn">${st.connected ? 'Disconnect' : 'Connect'}</button></div>
        <div class="row">${sel('model', 'Model', S.models, st.model)}</div>`)
      + grp('Reference', `<div class="row"><button class="btn filled" data-cmd="home" ${st.connected ? '' : 'disabled'}>Home</button></div>
        <p>Home moves the carriage to the reference corner and sets the origin there. After that the software knows the travel range.</p>`);
  } else if (step === 1) {
    const fmts = Object.keys(S.formats).concat(['Custom']);
    h = hdr('Paper', 'Tape the sheet to the table. Choose its size and tell the software where its top-left corner is.')
      + grp('Sheet', `<div class="row">${sel('fmt', 'Format', fmts, S.paper_name)}${sel('orient', 'Orientation', ['landscape', 'portrait'], S.orient, 'w', '')}</div>
        <div class="row">${tf('pw', 'Width', toU(S.paper[0]), {suffix: u()})}${tf('ph', 'Height', toU(S.paper[1]), {suffix: u()})}<button class="btn outlined" id="paperApply">Apply</button></div>`)
      + grp('Paper position', `<label class="radio"><input type="radio" name="pm" value="corner" ${S.pos_mode === 'corner' ? 'checked' : ''}>Against the stop corner (origin = home)</label>
        <label class="radio"><input type="radio" name="pm" value="jog" ${S.pos_mode === 'jog' ? 'checked' : ''}>Jog the pen to the paper corner</label>
        <label class="radio"><input type="radio" name="pm" value="hand" ${S.pos_mode === 'hand' ? 'checked' : ''}>Push the carriage to the corner by hand</label>`)
      + `<div class="grp wide" id="posBox"></div>`;
  } else if (step === 2) {
    h = hdr('Pen', 'Insert the pen. Lower it and adjust in 0.5 mm steps until it sits cleanly on the paper. Raise it and check that it clears the sheet.')
      + grp('Profile', `<div class="row">${sel('prof', 'Profile', Object.keys(S.profiles), S.profile_name)}${tf('profName', 'Save as', S.profile_name, {cls: 'grow', mono: false})}<button class="btn outlined" id="profSave">Save</button></div>`)
      + grp('Heights', `<div class="row">${tf('pen_up', 'Up', pr.pen_up, {suffix: 'mm'})}<button class="btn outlined" data-nz="pen_up,-0.5">−0.5</button><button class="btn outlined" data-nz="pen_up,0.5">+0.5</button></div>
        <div class="row">${tf('pen_down', 'Down', pr.pen_down, {suffix: 'mm'})}<button class="btn outlined" data-nz="pen_down,-0.5">−0.5</button><button class="btn outlined" data-nz="pen_down,0.5">+0.5</button></div>
        <div class="row"><button class="btn tonal" data-cmd="pen_up">Up</button><button class="btn tonal" data-cmd="pen_down">Down</button><button class="btn outlined" data-cmd="cycle">Cycle</button><button class="btn outlined" data-cmd="test_stroke">Test stroke</button></div>`)
      + grp('Move carriage', jogHtml(), 'wide');
  } else if (step === 3) {
    h = hdr('Speed', '')
      + grp('Feed rates', `<div class="row">${tf('feed_draw', 'Drawing', pr.feed_draw, {cls: 'grow', suffix: 'mm/min'})}${tf('feed_travel', 'Travel', pr.feed_travel, {cls: 'grow', suffix: 'mm/min'})}</div>
        <div class="row">${tf('line_width', 'Line width, measured', pr.line_width, {cls: 'grow', suffix: 'mm'})}<button class="btn outlined" id="profSave2">Save profile</button></div>`)
      + grp('Test patterns at the pen position', `<div class="row">${S.tests.map(t => `<button class="btn tonal" data-cmd="test" data-args='{"name":"${t}"}'>${t}</button>`).join('')}</div>
        <p>Line width: measure where the double lines separate, divide by 10. Speed: rows at 1000 to 8000 mm/min. Accuracy: square and circle twice in opposite directions, star, rulers. Pen height: rows at Z 3.0 to 6.5 mm.</p>`)
      + grp('Move carriage', jogHtml(), 'wide');
  } else {
    const rows = S.layers.map((l, i) => `<tr><td><input type="checkbox" data-layer="${i}" data-k="enabled" ${l.enabled ? 'checked' : ''} aria-label="Plot layer ${l.name}"></td>
      <td><input type="checkbox" data-layer="${i}" data-k="pause" ${l.pause ? 'checked' : ''} aria-label="Pause before ${l.name}"></td><td>${l.name} <span class="mono" style="color:var(--md-on-surface-variant)">${l.n}</span></td></tr>`).join('');
    const p = S.progress, pct = p && p.total ? 100 * p.done / p.total : 0;
    h = hdr('Plot', `${S.svg_name} · page ${fmt(S.page[0])} × ${fmt(S.page[1])} · paper ${fmt(S.paper[0])} × ${fmt(S.paper[1])}`)
      + grp('Placement', `<div class="row"><div class="seg">${[['1:1', '1:1'], ['center', 'Centered'], ['fit', 'Fit to paper']].map(([v, t]) => `<button class="btn ${S.placement === v ? 'on' : ''}" data-pl="${v}">${t}</button>`).join('')}</div></div>
        ${st.origin_set ? '' : '<div class="msg">Origin not set. Go to step 2, or plot from the current position.</div>'}`)
      + grp('Layers', `<table class="layers"><tr><th>Plot</th><th>Pause before</th><th>Layer · paths</th></tr>${rows || '<tr><td colspan="3">No layers. Open an SVG with paths.</td></tr>'}</table>`)
      + grp('Run', `<div class="row"><button class="btn filled" data-cmd="plot">Start plot</button><button class="btn danger" data-cmd="stop">Stop</button><button class="btn outlined" data-cmd="frame" data-args='{"kind":"drawing"}'>Trace drawing frame</button></div>
        <div class="progress"><i id="pbar" style="width:${pct}%"></i></div><div class="mono body-small" id="ptxt">${progressText()}</div>`);
  }
  $('panel').innerHTML = h;
  wirePanel();
}
function progressText() {
  const p = S.progress; if (!p) return '';
  const pct = p.total ? Math.round(100 * p.done / p.total) : 0;
  const eta = (p.eta == null || p.i >= p.n) ? '' : '   remaining ~' + Math.floor(p.eta / 60) + ':' + String(Math.round(p.eta % 60)).padStart(2, '0') + ' min';
  return `path ${p.i} / ${p.n}   ${pct} %${eta}`;
}
function renderProgress() { if (step !== 4) return; const p = S.progress; $('pbar').style.width = (p.total ? 100 * p.done / p.total : 0) + '%'; $('ptxt').textContent = progressText(); }
function syncPenFields() { const pr = S.state.profile; ['pen_up', 'pen_down'].forEach(k => { const e = $(k); if (e && document.activeElement !== e) e.value = pr[k]; }); }

function wirePanel() {
  const P = $('panel');
  const wireCmds = root => {
    root.querySelectorAll('[data-cmd]').forEach(b => b.onclick = () => {
      const args = b.dataset.args ? JSON.parse(b.dataset.args) : {};
      if (b.dataset.cmd === 'connect') args.port = $('port').value;
      cmd(b.dataset.cmd, args);
    });
    root.querySelectorAll('[data-move]').forEach(b => b.onclick = () => { const [x, y] = b.dataset.move.split(',').map(Number); jog(x, y); });
    root.querySelectorAll('[data-jog]').forEach(b => b.onclick = () => { jogIdx = +b.dataset.jog; renderPanel(); });
  };
  wireCmds(P);
  P.querySelectorAll('[data-nz]').forEach(b => b.onclick = () => { const [k, d] = b.dataset.nz.split(','); const v = Math.max(0, +(S.state.profile[k] + +d).toFixed(2)); cmd('set_profile', {[k]: v}); });
  P.querySelectorAll('[data-pl]').forEach(b => b.onclick = () => cmd('set_placement', {mode: b.dataset.pl}));
  P.querySelectorAll('[data-layer]').forEach(c => c.onchange = () => cmd('set_layer', {index: +c.dataset.layer, [c.dataset.k]: c.checked}));
  const on = (id, ev, fn) => { const e = $(id); if (e) e.addEventListener(ev, fn); };
  on('model', 'change', e => cmd('set_model', {name: e.target.value}));
  on('fmt', 'change', applyPaper); on('orient', 'change', applyPaper); on('paperApply', 'click', () => applyPaper(true));
  on('prof', 'change', e => cmd('load_profile', {name: e.target.value}));
  on('profSave', 'click', () => { pushProfileFields(); cmd('save_profile', {name: $('profName').value}); });
  on('profSave2', 'click', () => { pushProfileFields(); cmd('save_profile', {}); });
  ['pen_up', 'pen_down', 'feed_draw', 'feed_travel', 'line_width'].forEach(k => on(k, 'change', e => cmd('set_profile', {[k]: e.target.value})));
  P.querySelectorAll('input[name=pm]').forEach(r => r.onchange = () => { cmd('set_pos_mode', {mode: r.value}); S.pos_mode = r.value; renderPosBox(); });
  renderPosBox();
  wirePanel.wireCmds = wireCmds;
}
function pushProfileFields() { const a = {}; ['pen_up', 'pen_down', 'feed_draw', 'feed_travel', 'line_width'].forEach(k => { if ($(k)) a[k] = $(k).value; }); return cmd('set_profile', a); }
function renderPosBox() {
  const box = $('posBox'); if (!box) return;
  const m = S.pos_mode;
  if (m === 'corner') box.innerHTML = `<h2>Origin</h2><div class="row"><button class="btn filled" data-cmd="home">Origin = home</button><button class="btn tonal" data-cmd="frame" data-args='{"kind":"paper"}'>Trace frame</button></div>`;
  else if (m === 'jog') box.innerHTML = `<h2>Move to the corner</h2>` + jogHtml(`<div class="extra"><button class="btn filled" data-cmd="set_origin">Set origin here</button><button class="btn tonal" data-cmd="frame" data-args='{"kind":"paper"}'>Trace frame</button></div>`);
  else box.innerHTML = `<h2>By hand</h2><div class="row"><button class="btn tonal" data-cmd="release_motors">Release motors</button><button class="btn tonal" data-cmd="lock_motors">Lock motors</button><button class="btn filled" data-cmd="origin_by_hand">Set origin here</button><button class="btn tonal" data-cmd="frame" data-args='{"kind":"paper"}'>Trace frame</button></div>
    <p>Release, push the carriage with the pen tip onto the paper corner, then set the origin. The travel range is unknown afterwards; the machine frame is hidden.</p>`;
  wirePanel.wireCmds(box);
}
function applyPaper(custom) {
  const name = $('fmt').value, orient = $('orient').value;
  let w, h;
  if (name === 'Custom' || custom === true) { w = fromU($('pw').value); h = fromU($('ph').value); }
  else { [w, h] = S.formats[name]; if (orient === 'portrait') [w, h] = [h, w]; }
  if (!(w > 0 && h > 0)) return;
  cmd('set_paper', {w, h, name: custom === true ? 'Custom' : name, orient});
}
function jog(x, y) { const s = JOG[u()][jogIdx] * UNIT[u()]; cmd('jog', {dx: x * s, dy: y * s}); }

// ---------------------------------------------------------------- preview (SVG, user units = mm)
let fitMachine = false;   // false: view fits the paper; true: view fits the machine travel
$('zoom').oninput = e => { zoomIdx = +e.target.value; $('zoomlbl').textContent = ZOOM[zoomIdx] + '×'; if (zoomIdx <= 2) panX = panY = 0; renderPreview(); };
{ // drag to pan; double-click resets zoom and pan
  const svg = $('preview'); let drag = null;
  svg.onpointerdown = e => { if (ZOOM[zoomIdx] > 1) { drag = [e.clientX, e.clientY, panX, panY]; svg.setPointerCapture(e.pointerId); } };
  svg.onpointermove = e => { if (drag) { panX = drag[2] - (e.clientX - drag[0]) / pxPerMm; panY = drag[3] - (e.clientY - drag[1]) / pxPerMm; renderPreview(); } };
  svg.onpointerup = svg.onpointercancel = () => { drag = null; };
  svg.ondblclick = () => { zoomIdx = 2; panX = panY = 0; $('zoom').value = 2; $('zoomlbl').textContent = '1×'; renderPreview(); };
}
// title block corner cycles tl > tr > br > bl; the icon shows the current corner
const TB_CORNERS = ['tl', 'tr', 'br', 'bl'], TB_ICONS = {tl: '◰', tr: '◳', br: '◲', bl: '◱'};
let tbCorner = 'br'; try { tbCorner = localStorage.tbCorner || tbCorner; } catch (e) {}
let pxPerMm = 3;
const ZOOM = [0.5, 0.75, 1, 1.5, 2, 3, 4, 6, 8];   // slider snaps to these factors relative to the fitted view
let zoomIdx = 2, panX = 0, panY = 0;                // pan in mm
const px = n => n / pxPerMm;   // size in mm that renders as n screen pixels
function renderPreview() {
  const st = S.state, [pw, ph] = S.paper;
  const svg = $('preview');
  const bw = svg.clientWidth || 800, bh = svg.clientHeight || 500;
  let mx = 0, my = 0, mw = 0, mh = 0;
  if (st.bounds_known) { [mx, my] = st.machine_origin; [mw, mh] = MODELS[st.model] || [0, 0]; }
  let xs = [0, pw], ys = [0, ph];
  if (fitMachine && st.bounds_known) { xs.push(mx, mx + mw); ys.push(my, my + mh); }
  let x0 = Math.min(...xs), y0 = Math.min(...ys), x1 = Math.max(...xs), y1 = Math.max(...ys);
  const m = Math.max(x1 - x0, y1 - y0) * 0.06;  // margin for rulers
  x0 -= m + (x1 - x0) * 0.02; y0 -= m + (y1 - y0) * 0.02; x1 += m * 0.4; y1 += m * 0.4;
  // widen or heighten the view to the board's aspect ratio, so the sheet is centred without distortion
  const aspect = bw / bh;
  let vw = x1 - x0, vh = y1 - y0;
  if (vw / vh < aspect) { const nw = vh * aspect; x0 -= (nw - vw) / 2; vw = nw; } else { const nh = vw / aspect; y0 -= (nh - vh) / 2; vh = nh; }
  // zoom about the centre of the fitted view, then pan
  const zf = ZOOM[zoomIdx]; x0 += vw * (1 - 1 / zf) / 2 + panX; y0 += vh * (1 - 1 / zf) / 2 + panY; vw /= zf; vh /= zf;
  svg.classList.toggle('pan', zf > 1);
  pxPerMm = bw / vw;
  svg.setAttribute('viewBox', `${x0} ${y0} ${vw} ${vh}`);
  const lw = Math.max(px(1), st.profile.line_width || 0.3);
  let g = `<defs><pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="var(--mat-line)" stroke-width="${px(1)}"/></pattern>
    <pattern id="grid5" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="var(--mat-line-strong)" stroke-width="${px(1)}"/></pattern></defs>
    <rect x="${x0}" y="${y0}" width="${vw}" height="${vh}" fill="url(#grid)"/><rect x="${x0}" y="${y0}" width="${vw}" height="${vh}" fill="url(#grid5)"/>`;
  if (st.bounds_known) g += `<rect x="${mx}" y="${my}" width="${mw}" height="${mh}" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="${px(1.5)}" stroke-dasharray="${px(6)} ${px(4)}"/>
    <text x="${mx + mw - px(6)}" y="${my + mh - px(6)}" font-size="${px(12)}" text-anchor="end" fill="rgba(255,255,255,.65)" font-family="var(--f-draft)">${st.model} · ${fmt(mw)} × ${fmt(mh)}</text>`;
  g += `<rect x="0" y="0" width="${pw}" height="${ph}" fill="var(--paper)" stroke="rgba(0,0,0,.35)" stroke-width="${px(1)}"/>`;
  g += rulers(pw, ph);
  g += `<g id="strokes" stroke-width="${lw}">` + S.strokes.map((s, i) =>
    `<path class="stroke ${i < done ? 'done' : ''}" d="M${s.pts.map(p => p[0].toFixed(2) + ' ' + p[1].toFixed(2)).join('L')}"/>`).join('') + '</g>';
  g += titleBlock(pw, ph);
  g += `<circle cx="0" cy="0" r="${px(5)}" fill="none" stroke="var(--origin)" stroke-width="${px(1.5)}"/>`;
  g += `<g id="pen" class="penmark ${st.z_up === false ? 'down' : 'up'}" transform="translate(${st.x} ${st.y})" stroke-width="${px(1.5)}"><circle r="${px(8)}" fill="none"/><line x1="${-px(14)}" x2="${px(14)}"/><line y1="${-px(14)}" y2="${px(14)}"/></g>`;
  svg.innerHTML = g;
  $('fitseg').hidden = !st.bounds_known;
  $('fitseg').querySelectorAll('button').forEach(b => b.classList.toggle('on', (b.dataset.fit === 'machine') === fitMachine));
}
function rulers(pw, ph) {
  const unit = u(), step = {mm:10, cm:10, in:25.4}[unit], minor = {mm:5, cm:5, in:12.7}[unit];
  const lab = v => unit === 'in' ? (v / 25.4).toFixed(0) : (unit === 'cm' ? (v / 10).toFixed(0) : v.toFixed(0));
  const fs = px(10), t1 = px(4), t2 = px(8), gap = px(3);
  const every = Math.max(1, Math.ceil(px(34) / step));  // label spacing of at least 34 px
  let h = `<g class="ruler" font-size="${fs}" stroke-width="${px(1)}">`;
  for (let v = 0; v <= pw + 1e-6; v += minor) {
    const k = Math.round(v / step), major = Math.abs(v / step - k) < 1e-6;
    h += `<line x1="${v}" y1="${-gap}" x2="${v}" y2="${-gap - (major ? t2 : t1)}"/>`;
    if (major && k % every === 0) h += `<text x="${v + px(2)}" y="${-gap - t2 - px(2)}">${lab(v)}</text>`;
  }
  for (let v = 0; v <= ph + 1e-6; v += minor) {
    const k = Math.round(v / step), major = Math.abs(v / step - k) < 1e-6;
    h += `<line x1="${-gap}" y1="${v}" x2="${-gap - (major ? t2 : t1)}" y2="${v}"/>`;
    if (major && v > 0 && k % every === 0) h += `<text x="${-gap - t2 - px(2)}" y="${v + px(3)}" text-anchor="end">${lab(v)}</text>`;
  }
  return h + `<text x="${-gap - t2 - px(2)}" y="${-gap - t2 - px(2)}" text-anchor="end">${unit}</text></g>`;
}
function titleBlock(pw, ph) {
  // The drawing's title block in the sheet's lower right corner, as on a technical drawing. Sized in screen pixels.
  const st = S.state, pr = st.profile;
  const W = Math.min(px(230), pw * 0.45), H = W * 0.3, m = px(6);
  const x = tbCorner[1] === 'r' ? pw - W - m : m, y = tbCorner[0] === 'b' ? ph - H - m : m;
  const scale = S.placement === 'fit' ? (Math.min((S.paper[0] - 20) / S.page[0], (S.paper[1] - 20) / S.page[1])).toFixed(2) : '1:1';
  const rows = [['SHEET', `${S.paper_name} ${toU(S.paper[0])} × ${toU(S.paper[1])} ${u()}`], ['SCALE', scale === '1:1' ? '1:1' : `1:${(1 / scale).toFixed(2)} (${scale}×)`],
    ['PEN', `${S.profile_name} · ${pr.line_width} mm`], ['FEED', `${pr.feed_draw} / ${pr.feed_travel} mm/min`], ['FILE', S.svg_name]];
  const fk = H / rows.length * 0.42, fv = H / rows.length * 0.55, col = W * 0.18;
  let h = `<g class="tb" stroke-width="${px(1)}"><rect x="${x}" y="${y}" width="${W}" height="${H}" fill="var(--paper)"/>`;
  rows.forEach((r, i) => { const yy = y + (i + 0.72) * H / rows.length; h += `<text class="k" font-size="${fk}" x="${x + W * 0.02}" y="${yy}">${r[0]}</text><text class="v" font-size="${fv}" x="${x + col}" y="${yy}">${esc(r[1])}</text>`; });
  h += `<line x1="${x + col - W * 0.02}" y1="${y}" x2="${x + col - W * 0.02}" y2="${y + H}"/></g>`;
  return h;
}
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
function renderPen() {
  const st = S.state, pen = $('pen'); if (!pen) return renderPreview();
  pen.setAttribute('transform', `translate(${st.x} ${st.y})`);
  pen.setAttribute('class', 'penmark ' + (st.z_up === false ? 'down' : 'up'));
  if (st.bounds_known !== renderPen.lastBounds || st.model !== renderPen.lastModel) renderPreview();
  renderPen.lastBounds = st.bounds_known; renderPen.lastModel = st.model;
}
function markDone() { const ps = document.querySelectorAll('#strokes path'); ps.forEach((p, i) => p.classList.toggle('done', i < done)); }

// ---------------------------------------------------------------- global controls
$('units').querySelectorAll('button').forEach(b => b.onclick = () => cmd('set_unit', {unit: b.dataset.unit}));
$('back').onclick = () => showStep(step - 1); $('next').onclick = () => showStep(step + 1);
$('stop').onclick = () => cmd('stop');
$('pauseGo').onclick = () => { $('overlay').classList.remove('show'); cmd('resume'); };
$('pauseStop').onclick = () => { $('overlay').classList.remove('show'); cmd('stop'); };
document.addEventListener('keydown', e => {
  const t = e.target.tagName; if (t === 'INPUT' || t === 'SELECT' || t === 'TEXTAREA') return;
  const k = e.key;
  if (k === 'Escape') { cmd('stop'); return; }
  if (!S || !S.state.connected) return;
  if (e.shiftKey && (k === 'ArrowUp' || k === 'ArrowDown')) { cmd('nudge_z', {delta: k === 'ArrowUp' ? -0.5 : 0.5}); e.preventDefault(); return; }
  const mv = {ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0]}[k];
  if (mv) { jog(mv[0], mv[1]); e.preventDefault(); return; }
  if (k === ' ') { cmd('pen_toggle'); e.preventDefault(); return; }
  if ('123'.includes(k) && k) { jogIdx = +k - 1; renderPanel(); }
});
window.addEventListener('resize', () => S && renderPreview());
$('fitseg').querySelectorAll('button').forEach(b => b.onclick = () => { fitMachine = b.dataset.fit === 'machine'; renderPreview(); });
$('tbpos').textContent = TB_ICONS[tbCorner];
$('tbpos').onclick = () => { tbCorner = TB_CORNERS[(TB_CORNERS.indexOf(tbCorner) + 1) % 4]; $('tbpos').textContent = TB_ICONS[tbCorner]; try { localStorage.tbCorner = tbCorner; } catch (e) {} renderPreview(); };
connectEvents();
</script>
